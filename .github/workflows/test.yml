# Phase 8.1, workflow 1 of 2: runs on every push and pull request.
#
# The fixture job is the gate Phase 10.2 calls "the single most important test":
# does the generated Dockerfile actually build, for every supported stack, every
# time? Nothing ships if it fails.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: vet, test, build
    runs-on: ubuntu-latest
    services:
      # Real MongoDB for the repository contract test (Phase 10.1).
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Single source of truth for the toolchain version.
          go-version-file: go.mod
          cache: true

      - name: verify formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '\.pb\.go$' | grep -v '\.pb\.gw\.go$' || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: make vet

      # The CLI must never link the backend (Phase 2.1): checked, not assumed.
      - name: cli import boundary
        run: make check-cli-deps

      - name: test
        env:
          DEPLOYIQ_TEST_MONGO_URI: mongodb://localhost:27017
        run: make test-race

      - name: coverage of core packages (Phase 10.3)
        run: make cover

      - name: build
        run: make build

  proto:
    name: generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: arduino/setup-protoc@v3
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: install generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v2.22.0
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@v2.22.0
      # The protoc version is stamped into each file's header; a different
      # protoc patch release is not drift, so those lines are ignored.
      - name: regenerate and diff
        run: |
          make proto
          git diff --exit-code -I '^//[[:space:]]+(-[[:space:]]+)?protoc[[:space:]]' -- api/ \
            || { echo "::error::generated code is stale; run make proto"; exit 1; }

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  web:
    name: dashboard tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  fixtures:
    name: generated Dockerfiles build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Needed because the fixture suite runs a real `docker build` on every
      # Dockerfile the tool generates — a static assertion on the output text
      # would not catch the failure mode that matters (Phase 0.10).
      - uses: docker/setup-buildx-action@v4

      - name: run fixture suite
        run: make test-fixtures

  image:
    name: api image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile
          push: false
