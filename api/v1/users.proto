syntax = "proto3";

package deployiq.v1;

option go_package = "github.com/dhyaneshsiddhartha15/DeployIQ/api/v1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "common.proto";

// UsersService serves the authenticated user's own account (Phase 4.5:
// GET /api/v1/me). The OAuth login and callback routes are plain HTTP
// redirects, not RPCs, and live beside the gateway rather than in a proto.
service UsersService {
  rpc GetMe(Empty) returns (User) {
    option (google.api.http) = {
      get: "/api/v1/me"
    };
  }
}

// User is the dashboard account. There is no password field, by design
// (Phase 3.1: GitHub OAuth only, no password liability).
message User {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string github_id = 2 [json_name = "githubId"];
  string login = 3;
  string email = 4;
  string plan = 5;
  google.protobuf.Timestamp created_at = 6 [json_name = "createdAt"];
  string name = 7;
  // provider is "github" or "oidc".
  string provider = 8;
}
