# Lint configuration. Kept deliberately small: the default linter set plus the
# few that catch the mistakes this codebase actually cares about. Generated
# protobuf/gateway code is excluded — it is machine output, not reviewed source.
run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose

issues:
  exclude-dirs:
    - third_party
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*\\.pb\\.gw\\.go$"
  exclude-rules:
    # doc.go files are package documentation only.
    - path: doc\.go
      linters: [revive]
    # Test fixtures write temp files and parse forms without checking every
    # return: a failed setup step shows up as the test's own failure, and
    # wrapping each write in t.Fatal adds noise without adding a check.
    - path: _test\.go
      linters: [errcheck]
