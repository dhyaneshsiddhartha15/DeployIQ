# Local development stack: the API server (with the dashboard built in) plus a
# MongoDB instance.
#
# Development only. Production runs a single container on a small managed host
# with MongoDB Atlas behind it (Phase 2.3, Phase 8.3) — there is no compose file
# in the deployment path, and no Kubernetes anywhere (Phase 3.2).
#
#   make compose-up     start          http://localhost:8080
#   make compose-down   stop and delete the volume
#
# GitHub login needs an OAuth app whose callback is
# http://localhost:8080/api/v1/auth/github/callback; export
# DEPLOYIQ_GITHUB_CLIENT_ID and DEPLOYIQ_GITHUB_CLIENT_SECRET before starting.
# Everything else works without one.
#
# Secrets here are throwaway local values. Real ones live in the hosting
# platform's secret manager (Phase 8.4).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Loopback only — this is a dev database, not something to expose on a
      # shared network.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: build/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        # Wait for a database that actually answers, not just a started
        # container — otherwise the API fails its first connect and restarts.
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DEPLOYIQ_MONGO_URI: "mongodb://mongo:27017"
      DEPLOYIQ_MONGO_DATABASE: "deployiq"
      DEPLOYIQ_LOG_LEVEL: "debug"
      DEPLOYIQ_LOG_FORMAT: "text"
      DEPLOYIQ_SERVER_PUBLIC_URL: "http://localhost:8080"
      # Local placeholders unless real OAuth app credentials are exported.
      # Config validation requires all three to be set, so the server refuses
      # to start with a half-configured OAuth app.
      DEPLOYIQ_GITHUB_CLIENT_ID: "${DEPLOYIQ_GITHUB_CLIENT_ID:-local-dev}"
      DEPLOYIQ_GITHUB_CLIENT_SECRET: "${DEPLOYIQ_GITHUB_CLIENT_SECRET:-local-dev-secret}"
      DEPLOYIQ_AUTH_SESSION_SIGNING_KEY: "local-dev-signing-key-0123"
      # Optional overrides, e.g. to point at a fake GitHub in an e2e run.
      DEPLOYIQ_GITHUB_AUTH_URL: "${DEPLOYIQ_GITHUB_AUTH_URL:-https://github.com/login/oauth/authorize}"
      DEPLOYIQ_GITHUB_TOKEN_URL: "${DEPLOYIQ_GITHUB_TOKEN_URL:-https://github.com/login/oauth/access_token}"
      DEPLOYIQ_GITHUB_API_URL: "${DEPLOYIQ_GITHUB_API_URL:-https://api.github.com}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongo-data:
